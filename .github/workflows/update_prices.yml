name: Auto Update Ring Prices

on:
  schedule:
    # Runs every Monday at 00:00 UTC (09:00 KST)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Price Crawler
        run: |
          python scripts/crawler.py

      - name: Commit and Push if prices changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/rings.json data/crawl_log.json
          git diff --staged --quiet || (git commit -m "chore(data): auto-update wedding band prices and crawl logs [$(date +'%Y-%m-%d')]" && git push)
